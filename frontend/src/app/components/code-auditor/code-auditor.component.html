<div class="auditor-container">
  <div class="card">
    <h2 class="card-title">Smart Code Auditor</h2>
    <p class="card-subtitle">Paste code snippet below to perform AI-powered review for performance, security, and best practices.</p>

    <!-- Programming / Web Technology Selection Dropdown -->
    <div class="form-group">
      <label>Technology / Language</label>
      <select [(ngModel)]="language" class="input-field">
        <option value="Java">Java (Spring Boot)</option>
        <option value="TypeScript">TypeScript (Angular / Node.js)</option>
        <option value="JavaScript">JavaScript (ES6+ / Web API)</option>
        <option value="HTML">HTML5 (Semantics / Accessibility)</option>
        <option value="CSS">CSS3 / SCSS (Layout / Performance)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Context / Module Details</label>
      <input
        type="text"
        [(ngModel)]="context"
        placeholder="e.g. Navigation Bar Layout, Form Validation, or API Integration"
        class="input-field"
      />
    </div>

    <div class="form-group">
      <label>Code Snippet</label>
      <textarea
        [(ngModel)]="codeSnippet"
        rows="10"
        placeholder="Paste Java, TypeScript, JavaScript, HTML, or CSS snippet here..."
        class="textarea-field">
      </textarea>
    </div>

    <button
      (click)="auditCode()"
      [disabled]="loading() || !codeSnippet()"
      class="btn-primary">
      {{ loading() ? 'Analyzing Code...' : 'Audit Code with Gemini' }}
    </button>
  </div>

  <div *ngIf="aiOutput()" class="card result-card">
    <h3 class="result-title">AI Feedback & Recommendation:</h3>
    <markdown [data]="aiOutput()"></markdown>
  </div>
</div>
